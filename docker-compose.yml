# docker-compose.yml

services:
  # PostgreSQL with PostGIS
  db:
    image: postgis/postgis:16-3.4
    container_name: foodseen-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: foodseen_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # .NET API
  api:
    build:
      context: ./src/FoodSeen.API
      dockerfile: Dockerfile
    container_name: foodseen-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5001
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=foodseen_dev;Username=postgres;Password=postgres
      - Frontend__Url=http://localhost:5173
    ports:
      - "5001:5001"
    depends_on:
      db:
        condition: service_healthy

  # React Frontend (for development, you'd typically run this locally with npm)
  # Uncomment if you want to run frontend in Docker
  # client:
  #   build:
  #     context: ./src/food-seen-client
  #     dockerfile: Dockerfile
  #   container_name: foodseen-client
  #   ports:
  #     - "5173:5173"
  #   environment:
  #     - VITE_API_URL=http://localhost:5000
  #   volumes:
  #     - ./src/food-seen-client:/app
  #     - /app/node_modules
  #   command: npm run dev -- --host

volumes:
  postgres_data:
